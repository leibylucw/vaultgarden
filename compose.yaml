services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    hostname: vaultwarden
    user: 999:999
    env_file: vaultwarden/vaultwarden.env
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    tmpfs:
      - /tmp:size=128M,noexec,nosuid
    mem_limit: 512m
    cpus: "1.0"
    ports:
      - 127.0.0.1:6283:80
    volumes:
      - vaultwarden-data:/data

  vaultwarden-backup:
    image: bruceforce/vaultwarden-backup:latest
    container_name: vaultwarden-backup
    hostname: vaultwarden-backup
    user: root:root
    env_file: vaultwarden-backup/vaultwarden-backup.env
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - vaultwarden-data:/data:ro
      - vaultwarden-backups:/backups
      - vaultwarden-logs:/logs

  backend:
    build:
      context: ./backend
      dockerfile: ./Dockerfile
    image: backend
    container_name: backend
    hostname: backend
    user: 999:999
    env_file: backend/backend.env
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - 127.0.0.1:6284:5000
    volumes:
      - vaultwarden-backups:/backups
      - vaultwarden-logs:/logs

volumes:
  vaultwarden-data:
    name: vaultwarden-data
    external: true

  vaultwarden-backups:
    name: vaultwarden-backups
    external: true

  vaultwarden-logs:
    name: vaultwarden-logs
    external: true
